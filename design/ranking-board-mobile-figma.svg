<svg xmlns="http://www.w3.org/2000/svg" width="1170" height="2532" viewBox="0 0 1170 2532">
  <title>마석중학교 독도 퀴즈 - 실시간 랭킹 대시보드 (모바일 세로모드 1170x2532)</title>
  <desc>Figma에서 모바일 폰 뷰포트 레이아웃을 직접 수정할 수 있는 벡터 파일입니다.</desc>

  <defs>
    <!-- Background Gradient -->
    <linearGradient id="rank-bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c7edff"/>
      <stop offset="50%" stop-color="#eef9ff"/>
      <stop offset="100%" stop-color="#d9f0ff"/>
    </linearGradient>

