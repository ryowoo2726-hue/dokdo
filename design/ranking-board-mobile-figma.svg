      <path d="M21.9 22.3H23.7C25.3 22.3 26.2 21.5 26.2 20.1C26.2 18.9 25.3 18.1 23.9 18.1C22.6 18.1 21.7 18.8 21.6 20H18.2C18.3 17 20.6 15.2 24 15.2C27.4 15.2 29.7 17 29.7 19.7C29.7 21.6 28.6 23 26.8 23.5C28.9 23.9 30.1 25.4 30.1 27.5C30.1 30.5 27.6 32.5 24 32.5C20.3 32.5 17.9 30.6 17.8 27.5H21.4C21.5 28.8 22.5 29.6 24 29.6C25.5 29.6 26.5 28.7 26.5 27.3C26.5 25.8 25.5 25 23.7 25H21.9V22.3Z" fill="#4A2508"/>
