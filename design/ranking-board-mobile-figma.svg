      <path d="M13 15C16 11.5 20.5 10 25.5 10.5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
      <path d="M18.2 20.5C18.2 17.3 20.6 15.2 24.1 15.2C27.5 15.2 29.8 17.1 29.8 19.9C29.8 22 28.7 23.6 25.8 26.2L22.9 28.8H30V32.2H18.1V29.3L23.6 24.2C25.3 22.6 26 21.4 26 20.2C26 18.9 25.1 18.1 23.9 18.1C22.5 18.1 21.7 19 21.7 20.5H18.2Z" fill="#1E293B"/>
