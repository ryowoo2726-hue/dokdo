      <circle cx="24" cy="24" r="16" fill="#ffd43b" stroke="#FFF3BF" stroke-width="1.2"/>
      <path d="M13 15C16 11.5 20.5 10 25.5 10.5" stroke="#FFF9DB" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
      <path d="M25.8 15.2V32.5H21.9V19.3L18.7 21.2V17.8L23.5 15.2H25.8Z" fill="#5C3C00"/>
