<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" fill="none">
  <defs>
    <!-- 동해 하늘 & 바다 배경 그라데이션 -->
    <linearGradient id="bgSkySea" x1="280" y1="40" x2="280" y2="780" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B3E8FF"/>
      <stop offset="22%" stop-color="#DCF5FF"/>
      <stop offset="22.1%" stop-color="#0A96DF"/>
      <stop offset="40%" stop-color="#0077BE"/>
      <stop offset="40.1%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- 금·은·동 메탈릭 그라데이션 -->
    <linearGradient id="goldOuter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF3BF"/>
      <stop offset="35%" stop-color="#FFD43B"/>
      <stop offset="100%" stop-color="#F08C00"/>
    </linearGradient>
    <linearGradient id="goldInner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="100%" stop-color="#F59F00"/>
    </linearGradient>

    <linearGradient id="silverOuter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="40%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="silverInner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <linearGradient id="bronzeOuter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFEFE0"/>
      <stop offset="40%" stop-color="#E8A87C"/>
      <stop offset="100%" stop-color="#A65A2A"/>
    </linearGradient>
    <linearGradient id="bronzeInner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8D4B4"/>
      <stop offset="100%" stop-color="#C97A40"/>
    </linearGradient>

    <!-- 상위권 점수 블루 그라데이션 -->
    <linearGradient id="primaryBlueGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2B8BE6"/>
      <stop offset="100%" stop-color="#1C76CE"/>
    </linearGradient>
  </defs>

  <!-- 전체 캔버스 배경 (Figma Slides / Design 드래그 앤 드롭용) -->
  <rect id="Canvas-Background" width="1200" height="820" fill="#F1F5F9"/>

  <!-- ======================================================================
       [요소 1] 좌측: 현재 UI 기반 랭크 대시보드 전체 프레임 (440x740)
       ====================================================================== -->
  <g id="Element-1-Dashboard-UI" transform="translate(60, 40)">
    <!-- 모바일 앱 외곽 배경 -->
    <rect id="Mobile-App-Frame" x="0" y="0" width="440" height="740" rx="32" fill="url(#bgSkySea)" stroke="#CBD5E1" stroke-width="2"/>

    <!-- 상단 헤더 영역 -->
    <g id="Dashboard-Header" transform="translate(0, 24)">
      <rect id="Date-Chip" x="155" y="0" width="130" height="26" rx="13" fill="#FFFFFF" fill-opacity="0.88"/>
      <text x="220" y="17" text-anchor="middle" fill="#1668B8" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="12" font-weight="700">10.25 독도의 날</text>
      <text x="220" y="54" text-anchor="middle" fill="#111827" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="22" font-weight="900">마석중학교 독도 퀴즈</text>
      <text x="220" y="80" text-anchor="middle" fill="#FFFFFF" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="15" font-weight="800">실시간 랭킹 대시보드</text>
    </g>

    <!-- 하단 화이트 바텀 시트 -->
    <rect id="White-Bottom-Sheet" x="0" y="170" width="440" height="570" rx="32" fill="#FFFFFF"/>

    <!-- 시트 상단 타이틀 -->
    <g id="Sheet-Title-Group" transform="translate(24, 196)">
      <rect x="136" y="0" width="120" height="26" rx="13" fill="#E8F7F1" stroke="#B2F2BB" stroke-width="1"/>
      <circle cx="152" cy="13" r="4" fill="#12B886"/>
      <text x="202" y="17" text-anchor="middle" fill="#087957" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="11" font-weight="800">실시간 랭킹 보드</text>
      <text x="196" y="52" text-anchor="middle" fill="#111827" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="22" font-weight="900">독도 퀴즈 명예의 전당</text>
      <text x="196" y="74" text-anchor="middle" fill="#52667A" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="12" font-weight="600">참여 학생 42명 · 맞춘 점수순 실시간 집계</text>
    </g>

    <!-- 1등 행 (Row 1) -->
    <g id="Rank-Row-1" transform="translate(24, 290)">
      <rect width="392" height="68" rx="20" fill="#FFFDF2" stroke="#FFD43B" stroke-width="2"/>
      <!-- 금메달 숫자 1 -->
      <g id="Row1-Gold-Badge" transform="translate(14, 14)">
        <circle cx="20" cy="20" r="19" fill="url(#goldOuter)" stroke="#FFF9DB" stroke-width="1.5"/>
        <circle cx="20" cy="20" r="14.5" fill="url(#goldInner)" stroke="#FFF3BF" stroke-width="1"/>
        <text x="20" y="26" text-anchor="middle" fill="#5C3C00" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="18" font-weight="900">1</text>
      </g>
      <!-- 학번 & 닉네임 -->
      <g id="Row1-Student-Info" transform="translate(66, 13)">
        <rect x="0" y="0" width="48" height="19" rx="9.5" fill="#E1F0FF"/>
        <text x="24" y="13.5" text-anchor="middle" fill="#1668B8" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="11" font-weight="800">20312</text>
        <text x="56" y="13.5" fill="#52667A" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="11" font-weight="600">2학년 3반 12번</text>
        <text x="0" y="38" fill="#111827" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="15" font-weight="800">독도지킴이강치</text>
      </g>
      <!-- 점수 칸 -->
      <g id="Row1-Score-Slot" transform="translate(294, 14)">
        <rect width="82" height="38" rx="19" fill="url(#primaryBlueGrad)" stroke="#1668B8" stroke-width="1.5"/>
        <text x="35" y="25" text-anchor="middle" fill="#FFFFFF" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="16" font-weight="900">100</text>
        <text x="63" y="24" text-anchor="middle" fill="#E1F0FF" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="11" font-weight="700">점</text>
      </g>
    </g>

    <!-- 2등 행 (Row 2) -->
    <g id="Rank-Row-2" transform="translate(24, 370)">
      <rect width="392" height="68" rx="20" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
      <g id="Row2-Silver-Badge" transform="translate(14, 14)">
        <circle cx="20" cy="20" r="19" fill="url(#silverOuter)" stroke="#FFFFFF" stroke-width="1.5"/>
        <circle cx="20" cy="20" r="14.5" fill="url(#silverInner)" stroke="#F8FAFC" stroke-width="1"/>
        <text x="20" y="26" text-anchor="middle" fill="#1E293B" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="18" font-weight="900">2</text>
      </g>
      <g id="Row2-Student-Info" transform="translate(66, 13)">
        <rect x="0" y="0" width="48" height="19" rx="9.5" fill="#E1F0FF"/>
        <text x="24" y="13.5" text-anchor="middle" fill="#1668B8" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="11" font-weight="800">30105</text>
        <text x="56" y="13.5" fill="#52667A" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="11" font-weight="600">3학년 1반 5번</text>
        <text x="0" y="38" fill="#111827" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="15" font-weight="800">울릉도동남쪽뱃길</text>
      </g>
      <g id="Row2-Score-Slot" transform="translate(294, 14)">
        <rect width="82" height="38" rx="19" fill="url(#primaryBlueGrad)" stroke="#1668B8" stroke-width="1.5"/>
        <text x="35" y="25" text-anchor="middle" fill="#FFFFFF" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="16" font-weight="900">100</text>
        <text x="63" y="24" text-anchor="middle" fill="#E1F0FF" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="11" font-weight="700">점</text>
      </g>
    </g>

    <!-- 3등 행 (Row 3 - 내 순위 강조) -->
    <g id="Rank-Row-3" transform="translate(24, 450)">
      <rect width="392" height="68" rx="20" fill="#FFFFFF" stroke="#2282DC" stroke-width="2.5"/>
      <g id="Row3-Bronze-Badge" transform="translate(14, 14)">
        <circle cx="20" cy="20" r="19" fill="url(#bronzeOuter)" stroke="#FFF5EB" stroke-width="1.5"/>
        <circle cx="20" cy="20" r="14.5" fill="url(#bronzeInner)" stroke="#FFEFE0" stroke-width="1"/>
        <text x="20" y="26" text-anchor="middle" fill="#4A2508" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="18" font-weight="900">3</text>
      </g>
      <g id="Row3-Student-Info" transform="translate(66, 13)">
        <rect x="0" y="0" width="48" height="19" rx="9.5" fill="#E1F0FF"/>
        <text x="24" y="13.5" text-anchor="middle" fill="#1668B8" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="11" font-weight="800">10421</text>
        <text x="56" y="13.5" fill="#52667A" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="11" font-weight="600">1학년 4반 21번</text>
        <text x="0" y="38" fill="#111827" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="15" font-weight="800">동해의푸른별</text>
      </g>
      <g id="Row3-Score-Slot" transform="translate(294, 14)">
        <rect width="82" height="38" rx="19" fill="url(#primaryBlueGrad)" stroke="#1668B8" stroke-width="1.5"/>
        <text x="35" y="25" text-anchor="middle" fill="#FFFFFF" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="16" font-weight="900">90</text>
        <text x="63" y="24" text-anchor="middle" fill="#E1F0FF" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="11" font-weight="700">점</text>
      </g>
    </g>

    <!-- 4등 행 (Row 4 - 일반 순위) -->
    <g id="Rank-Row-4" transform="translate(24, 530)">
      <rect width="392" height="68" rx="20" fill="#F8FAFC" stroke="#E5EBF2" stroke-width="2"/>
      <g id="Row4-Normal-Badge" transform="translate(14, 14)">
        <circle cx="20" cy="20" r="19" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5"/>
        <text x="20" y="26" text-anchor="middle" fill="#52667A" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="16" font-weight="800">4</text>
      </g>
      <g id="Row4-Student-Info" transform="translate(66, 13)">
        <rect x="0" y="0" width="48" height="19" rx="9.5" fill="#E1F0FF"/>
        <text x="24" y="13.5" text-anchor="middle" fill="#1668B8" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="11" font-weight="800">20618</text>
        <text x="56" y="13.5" fill="#52667A" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="11" font-weight="600">2학년 6반 18번</text>
        <text x="0" y="38" fill="#111827" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="15" font-weight="800">이사부장군후예</text>
      </g>
      <g id="Row4-Score-Slot" transform="translate(294, 14)">
        <rect width="82" height="38" rx="19" fill="#FFFFFF" stroke="#D0E5FB" stroke-width="1.5"/>
        <text x="35" y="25" text-anchor="middle" fill="#2282DC" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="16" font-weight="900">80</text>
        <text x="63" y="24" text-anchor="middle" fill="#52667A" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="11" font-weight="700">점</text>
      </g>
    </g>
  </g>

  <!-- ======================================================================
       우측: 개별 요소 에셋 보드 (파워포인트/피그마에서 개별 이동·편집 가능)
       ====================================================================== -->

  <!-- [요소 2] 1~3등 금·은·동 숫자 배지 에셋 그룹 -->
  <g id="Element-2-Gold-Silver-Bronze-Badges" transform="translate(560, 40)">
    <rect width="580" height="220" rx="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="28" y="40" fill="#1668B8" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="16" font-weight="900">[요소 2] 1등 ~ 3등 금·은·동 숫자 표시 에셋</text>
    <text x="28" y="64" fill="#52667A" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="13" font-weight="600">각 원형 도형과 숫자가 그룹화되어 있어 자유롭게 크기·색상·위치를 바꿀 수 있습니다.</text>

    <!-- 1등 금 배지 -->
    <g id="Asset-Badge-1-Gold" transform="translate(65, 92)">
      <circle cx="36" cy="36" r="34" fill="url(#goldOuter)" stroke="#FFF9DB" stroke-width="3"/>
      <circle cx="36" cy="36" r="26" fill="url(#goldInner)" stroke="#FFF3BF" stroke-width="2"/>
      <text x="36" y="46" text-anchor="middle" fill="#5C3C00" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="28" font-weight="900">1</text>
      <text x="36" y="96" text-anchor="middle" fill="#B45309" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="13" font-weight="800">1등 (금)</text>
    </g>

    <!-- 2등 은 배지 -->
    <g id="Asset-Badge-2-Silver" transform="translate(195, 92)">
      <circle cx="36" cy="36" r="34" fill="url(#silverOuter)" stroke="#FFFFFF" stroke-width="3"/>
      <circle cx="36" cy="36" r="26" fill="url(#silverInner)" stroke="#F8FAFC" stroke-width="2"/>
      <text x="36" y="46" text-anchor="middle" fill="#1E293B" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="28" font-weight="900">2</text>
      <text x="36" y="96" text-anchor="middle" fill="#475569" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="13" font-weight="800">2등 (은)</text>
    </g>

    <!-- 3등 동 배지 -->
    <g id="Asset-Badge-3-Bronze" transform="translate(325, 92)">
      <circle cx="36" cy="36" r="34" fill="url(#bronzeOuter)" stroke="#FFF5EB" stroke-width="3"/>
      <circle cx="36" cy="36" r="26" fill="url(#bronzeInner)" stroke="#FFEFE0" stroke-width="2"/>
      <text x="36" y="46" text-anchor="middle" fill="#4A2508" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="28" font-weight="900">3</text>
      <text x="36" y="96" text-anchor="middle" fill="#92400E" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="13" font-weight="800">3등 (동)</text>
    </g>

    <!-- 4등 이하 일반 배지 -->
    <g id="Asset-Badge-4-Default" transform="translate(455, 92)">
      <circle cx="36" cy="36" r="34" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2.5"/>
      <text x="36" y="46" text-anchor="middle" fill="#52667A" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="26" font-weight="800">4</text>
      <text x="36" y="96" text-anchor="middle" fill="#64748B" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="13" font-weight="700">4등 이하</text>
    </g>
  </g>

  <!-- [요소 3] 학생 학번과 닉네임이 들어갈 칸 에셋 그룹 -->
  <g id="Element-3-Student-ID-Nickname-Slot" transform="translate(560, 290)">
    <rect width="580" height="230" rx="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="28" y="40" fill="#1668B8" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="16" font-weight="900">[요소 3] 학생 학번 · 닉네임 칸 에셋</text>
    <text x="28" y="64" fill="#52667A" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="13" font-weight="600">학번 알약 도형, 학년·반·번호 보조 텍스트, 닉네임 텍스트가 분리되어 있습니다.</text>

    <!-- 기본형 학번·닉네임 칸 -->
    <g id="Asset-Student-Box-Default" transform="translate(28, 90)">
      <rect width="250" height="104" rx="20" fill="#F8FAFC" stroke="#E5EBF2" stroke-width="2"/>
      <rect id="Chip-Bg-1" x="18" y="20" width="58" height="24" rx="12" fill="#E1F0FF"/>
      <text x="47" y="36" text-anchor="middle" fill="#1668B8" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="13" font-weight="800">20312</text>
      <text x="86" y="36" fill="#52667A" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="13" font-weight="600">2학년 3반 12번</text>
      <text x="18" y="76" fill="#111827" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" font-weight="900">독도지킴이강치</text>
    </g>

    <!-- 본인 강조형 학번·닉네임 칸 -->
    <g id="Asset-Student-Box-Me" transform="translate(300, 90)">
      <rect width="250" height="104" rx="20" fill="#FFFFFF" stroke="#2282DC" stroke-width="2.5"/>
      <rect id="Chip-Bg-2" x="18" y="20" width="58" height="24" rx="12" fill="#E1F0FF"/>
      <text x="47" y="36" text-anchor="middle" fill="#1668B8" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="13" font-weight="800">10421</text>
      <rect x="84" y="20" width="52" height="24" rx="12" fill="#2282DC"/>
      <text x="110" y="36" text-anchor="middle" fill="#FFFFFF" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="11" font-weight="800">내 순위</text>
      <text x="18" y="76" fill="#111827" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" font-weight="900">동해의푸른별</text>
    </g>
  </g>

  <!-- [요소 4] 점수가 들어갈 칸 에셋 그룹 -->
  <g id="Element-4-Score-Slot" transform="translate(560, 550)">
    <rect width="580" height="230" rx="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="28" y="40" fill="#1668B8" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="16" font-weight="900">[요소 4] 점수가 들어갈 칸 에셋</text>
    <text x="28" y="64" fill="#52667A" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="13" font-weight="600">1~3등 강조형(블루 그라데이션)과 일반 순위형(화이트·블루 보더) 점수 박스입니다.</text>

    <!-- 상위권 강조형 점수 칸 -->
    <g id="Asset-Score-Top" transform="translate(65, 96)">
      <rect width="180" height="72" rx="36" fill="url(#primaryBlueGrad)" stroke="#1668B8" stroke-width="2"/>
      <text x="78" y="47" text-anchor="middle" fill="#FFFFFF" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="32" font-weight="900">100</text>
      <text x="132" y="45" text-anchor="middle" fill="#E1F0FF" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="18" font-weight="800">점</text>
      <text x="90" y="102" text-anchor="middle" fill="#1668B8" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="13" font-weight="800">1~3등 강조형 점수 칸</text>
    </g>

    <!-- 일반 순위형 점수 칸 -->
    <g id="Asset-Score-Normal" transform="translate(325, 96)">
      <rect width="180" height="72" rx="36" fill="#FFFFFF" stroke="#9EC8F3" stroke-width="2.5"/>
      <text x="78" y="47" text-anchor="middle" fill="#2282DC" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="32" font-weight="900">80</text>
      <text x="128" y="45" text-anchor="middle" fill="#52667A" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="18" font-weight="800">점</text>
      <text x="90" y="102" text-anchor="middle" fill="#52667A" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="13" font-weight="800">일반 순위 점수 칸</text>
    </g>
  </g>
</svg>
