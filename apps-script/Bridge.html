<!doctype html><html><head><meta charset="utf-8"><title>독도 퀴즈 저장 연결</title></head><body>
<p>학생 퀴즈는 GitHub Pages에서 이용해 주세요. 이 페이지는 구글 시트 저장 연결용입니다.</p>
<script>
'use strict';
const channel=<?!= JSON.stringify(channel) ?>;
const parentOrigin=<?!= JSON.stringify(parentOrigin) ?>;
if(channel&&window.top!==window){
  window.addEventListener('message',event=>{
    const data=event.data;
    if(event.origin!==parentOrigin||event.source!==window.top||!data||data.channel!==channel||data.type!=='DOKDO_CALL'||typeof data.id!=='string'||data.id.length>80)return;
    if(!['startAttempt','submitAttempt'].includes(data.method))return;
    const reply=message=>event.source.postMessage({type:'DOKDO_RESULT',channel,id:data.id,...message},parentOrigin);
    google.script.run.withSuccessHandler(result=>reply({result})).withFailureHandler(error=>reply({error:error.message||'저장하지 못했습니다.'}))[data.method](data.payload);
  });
  window.top.postMessage({type:'DOKDO_READY',channel},parentOrigin);
}
</script></body></html>
